name: Update Stats Images

on:
  schedule:
    - cron: '0 6 * * *'   # todos los días a las 6:00 UTC (~00:00 CDMX)
  workflow_dispatch:        # también puedes correrlo manualmente desde la pestaña Actions

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download stats images
        run: |
          curl -sSL "https://github-readme-stats.vercel.app/api?username=jhoracio19&show_icons=true&theme=tokyonight&hide_border=true&locale=en&count_private=true" -o stats.svg
          curl -sSL "https://github-readme-stats.vercel.app/api/top-langs/?username=jhoracio19&layout=compact&theme=tokyonight&hide_border=true&locale=en" -o top-langs.svg
          curl -sSL "https://streak-stats.demolab.com/?user=jhoracio19&theme=tokyonight&hide_border=true" -o streak.svg
          curl -sSL "https://github-readme-activity-graph.vercel.app/graph?username=jhoracio19&theme=tokyo-night&hide_border=true" -o activity-graph.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg streak.svg activity-graph.svg
          git diff --staged --quiet || git commit -m "chore: update stats images"
          git push
